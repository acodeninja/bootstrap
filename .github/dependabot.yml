version: 2

# What keeps .github/workflows/actions.lock current. Dependabot regenerates the
# matching lockfile entry in the same pull request as the version bump, so the
# workflow and the lockfile cannot drift apart -- and nothing else here updates
# an action at all.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits, like every other commit in this repository. Without
    # this the subject is "Bump actions/checkout from ...".
    commit-message:
      prefix: chore
    # One pull request, because these are four actions across one workflow and
    # reviewing them apart buys nothing.
    groups:
      actions:
        patterns:
          - "*"

  # Every FROM line in every template, none of which any
  # tool has ever looked at. directories globs because each template's build
  # context is its own directory.
  - package-ecosystem: docker
    directories:
      - /templates/*/files
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # One pull request rather than one per template. It touches every
    # template, which makes scope select all of them, so the full matrix is
    # what reviews it -- the point of grouping, not a cost of it.
    groups:
      base-images:
        patterns:
          - "*"
