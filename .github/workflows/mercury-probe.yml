name: mercury probe

# Throwaway. Mercury is the one language left with no package and no image:
# Debian dropped it and upstream ships source only, so a template would
# bootstrap the compiler from C on every cache miss. That is affordable or it
# is not, and the number decides whether the row is written at all -- see
# docs/languages.md on the elm probe for why this is measured rather than
# guessed. Delete this file in the commit that acts on the result.
#
# It builds inside the base image the template would use, not on the runner,
# so the figure is the one the Dockerfile would pay.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: bootstrap mercury in the template's base image
        run: |
          cat > /tmp/probe.sh <<'SH'
          set -eu
          phase() { printf '\n=== %s\n' "$1" >&2; date +%s; }

          start=$(phase apt)
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gcc libc6-dev make flex bison >/dev/null
          apt_done=$(date +%s)

          phase download >/dev/null
          curl -fsSL -o /tmp/mercury.tar.gz \
            "https://dl.mercurylang.org/release/mercury-srcdist-${VERSION}.tar.gz"
          printf '%s  /tmp/mercury.tar.gz\n' "$SHA512" > /tmp/mercury.sha512
          sha512sum -c /tmp/mercury.sha512
          mkdir -p /tmp/src
          tar -xzf /tmp/mercury.tar.gz -C /tmp/src --strip-components=1
          download_done=$(date +%s)

          phase configure >/dev/null
          cd /tmp/src
          # One grade rather than the default set. The difference is the whole
          # question: hlc.gc is the C back end with Boehm GC, which is what a
          # template would ever use.
          ./configure --prefix=/opt/mercury --enable-libgrades=hlc.gc >/dev/null
          configure_done=$(date +%s)

          phase make >/dev/null
          make PARALLEL=-j"$(nproc)" >/dev/null
          make_done=$(date +%s)

          phase install >/dev/null
          make PARALLEL=-j"$(nproc)" install >/dev/null
          install_done=$(date +%s)

          export PATH=/opt/mercury/bin:$PATH
          mmc --version

          phase hello >/dev/null
          mkdir -p /tmp/hello && cd /tmp/hello
          cat > hello.m <<'EOM'
          :- module hello.
          :- interface.
          :- import_module io.
          :- pred main(io::di, io::uo) is det.
          :- implementation.
          main(!IO) :- io.write_string("ok\n", !IO).
          EOM
          mmc --make hello >/dev/null
          ./hello
          hello_done=$(date +%s)

          echo
          echo "apt       $((apt_done - start))s"
          echo "download  $((download_done - apt_done))s"
          echo "configure $((configure_done - download_done))s"
          echo "make      $((make_done - configure_done))s"
          echo "install   $((install_done - make_done))s"
          echo "hello     $((hello_done - install_done))s"
          echo "TOTAL     $((hello_done - start))s"
          echo "image     $(du -sh /opt/mercury | cut -f1)"
          SH

          docker run --rm \
            -e VERSION=22.01.9 \
            -e SHA512=35f10827c42f70c39d84e2948b378da10671f6ac41a7dddffdb7b1abb06d6f10bd02e24d0ad781cc4b75839aa23017af0137d2d20fe8df7c4ebb48b76586241b \
            -v /tmp/probe.sh:/probe.sh:ro \
            debian:trixie-20261104-slim sh /probe.sh
