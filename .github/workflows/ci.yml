name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This job builds twenty-six images against a Docker Hub account limit that is
# shared with the publish workflow. Stacked runs of both exhaust it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is whatever is in templates/, discovered with the same glob
  # bootstrap.sh uses, so adding a template needs no edit here.
  templates:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - id: ids
        run: |
          ids=$(for f in templates/*/template.env; do d=${f%/template.env}; printf '"%s",' "${d##*/}"; done)
          echo "ids=[${ids%,}]" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: templates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.templates.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7

      # Without an identity bootstrap.sh takes its commitless fallback, exits 0,
      # and the commit path silently stops being covered.
      - name: git identity
        run: |
          git config --global user.name 'bootstrap ci'
          git config --global user.email 'ci@example.invalid'

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # --no-pull because the point of this job is the Dockerfile. Pulling the
      # published image would test the previous commit's toolchain against this
      # commit's templates, and a broken Dockerfile would go green.
      - run: ./bootstrap.sh ${{ matrix.template }} ../scaffold --no-pull

  # Asserting which failure happened, not merely that one did.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: git identity
        run: |
          git config --global user.name 'bootstrap ci'
          git config --global user.email 'ci@example.invalid'

      - name: exit codes
        run: |
          expect() {
            local want=$1
            shift
            set +e
            "$@" >/dev/null 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "expected $want from '$*', got $got" >&2
              exit 1
            fi
          }
          expect 1 ./bootstrap.sh
          expect 1 ./bootstrap.sh --nosuchflag javascript ../out
          expect 2 ./bootstrap.sh nosuchlang ../out
          expect 3 ./bootstrap.sh javascript .
          expect 0 ./bootstrap.sh javascript ../out --dry-run

      - name: dry-run writes nothing
        run: |
          ./bootstrap.sh javascript ../out --dry-run
          test ! -e ../out

      - name: no token survives substitution
        run: |
          ./bootstrap.sh javascript ../out --no-build
          ! grep -rn '{{[A-Z_]\{2,\}}}' ../out

      # .env carries the host uid and gid, so it is generated and gitignored --
      # a commit containing it would be a real bug nothing else here would see.
      - name: the scaffold is committed
        run: |
          ./bootstrap.sh javascript ../committed --no-build | tee ../scaffold.log
          grep -q 'initialised, 1 commit' ../scaffold.log
          git -C ../committed rev-parse --abbrev-ref HEAD | grep -qx main
          test "$(git -C ../committed rev-list --count HEAD)" -eq 1
          test "$(git -C ../committed log -1 --pretty=%s)" = 'chore: bootstrap javascript project'
          test -z "$(git -C ../committed status --porcelain)"
          test -f ../committed/.env
          test -z "$(git -C ../committed ls-files .env)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck bootstrap.sh

      - name: hadolint every template dockerfile
        run: |
          for f in templates/*/files/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done

      # Explicit paths: actionlint only discovers .github/workflows at the repo
      # root, so a bare invocation silently skips every template's workflow.
      - name: actionlint every workflow
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -color .github/workflows/*.yml templates/*/files/.github/workflows/ci.yml

  # The matrix above only exercises clone mode. Remote mode has its own failure
  # surface -- the ref, the download, the extract, the cleanup -- and no file on
  # disk, so nothing else here touches it. Both URLs are pinned to this commit
  # so the script under test fetches the templates that shipped with it, which
  # is the bug a floating ref would hide.
  remote:
    runs-on: ubuntu-latest
    env:
      sha: ${{ github.sha }}
    steps:
      - name: scaffold through the documented one-liner
        run: |
          BOOTSTRAP_REF=$sha /bin/bash -c \
            "$(curl -fsSL "https://raw.githubusercontent.com/acodeninja/bootstrap/$sha/bootstrap.sh")" \
            -- javascript ../out --no-git --no-build
          test -f ../out/package.json

      - name: a bad ref exits 6 and leaves no temporary directory
        run: |
          before=$(find /tmp -maxdepth 1 -name 'tmp.*' -type d | wc -l)
          set +e
          BOOTSTRAP_REF=refs/heads/no-such-branch /bin/bash -c \
            "$(curl -fsSL "https://raw.githubusercontent.com/acodeninja/bootstrap/$sha/bootstrap.sh")" \
            -- javascript ../bad --no-git --no-build >/dev/null 2>&1
          got=$?
          set -e
          if [ "$got" -ne 6 ]; then echo "expected 6 from a bad ref, got $got" >&2; exit 1; fi
          test ! -e ../bad
          after=$(find /tmp -maxdepth 1 -name 'tmp.*' -type d | wc -l)
          if [ "$before" -ne "$after" ]; then echo "a temporary directory survived" >&2; exit 1; fi
