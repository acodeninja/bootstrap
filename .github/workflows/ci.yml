name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The weekly rebuild is load-bearing and was previously untestable without
  # waiting for Monday.
  workflow_dispatch:
  # Nothing tests a template unless it changes, so upstream breakage -- a moved
  # base tag, an apt or Hackage outage -- would otherwise surface on whoever
  # next edits one. Off the hour, because scheduled runs on the hour are the
  # ones GitHub delays.
  schedule:
    - cron: '17 4 * * 1'

# packages: write is granted per job, to the three that push, rather than here:
# at workflow level it would hand write scope to the lint, contract and remote
# jobs as well.
permissions:
  contents: read

# One workflow now builds, tests and publishes, so a stacked run holds every
# build in flight against a Docker Hub limit that is counted per account.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What is in templates/, and whether anything worth building changed. Both
  # questions are a checkout and an output, so they are one job. No hyphen in
  # the name: `-` is subtraction in a GitHub expression, so a hyphenated job id
  # forces needs['like-this'] at every reference.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.select.outputs.ids }}
      build: ${{ steps.select.outputs.build }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Which templates to build, rather than whether to build at all. A
      # template's image can only change when that template changes, so a push
      # that adds one has no business rebuilding the other thirty-four -- and
      # docs, the README and bootstrap.ps1 cannot change any image.
      #
      # Drift is what building everything used to catch: a base image tag that
      # moved, an apt package that stopped existing. The weekly run does that
      # now, which is what makes this gate safe.
      - id: select
        env:
          event: ${{ github.event_name }}
          ref: ${{ github.ref }}
          before: ${{ github.event.before }}
          pr_base: ${{ github.event.pull_request.base.sha }}
          after: ${{ github.sha }}
        run: |
          base=$before
          if [ "$event" = pull_request ]; then base=$pr_base; fi

          # Everything is the answer when the question cannot be asked -- a new
          # branch, a force push, or the weekly and manual runs, which have
          # nothing to diff and exist to rebuild the lot.
          everything=no
          changed=
          if [ "$event" = schedule ] || [ "$event" = workflow_dispatch ] ||
            ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            everything=yes
          else
            changed=$(git diff --name-only "$base" "$after")
            # These two feed every image: the script that scaffolds each project
            # before it is built, and the workflow that does the building.
            if printf '%s\n' "$changed" | grep -qxF -e bootstrap.sh -e .github/workflows/ci.yml; then
              everything=yes
            fi
          fi

          if [ "$everything" = yes ]; then
            selected=$(for f in templates/*/template.env; do d=${f%/template.env}; echo "${d##*/}"; done)
          else
            selected=$(printf '%s\n' "$changed" | sed -n 's|^templates/\([^/]*\)/.*|\1|p' | sort -u)
          fi

          # A deleted template is in the diff and has nothing left to build.
          ids=$(printf '%s\n' "$selected" | while IFS= read -r id; do
            if [ -n "$id" ] && [ -f "templates/$id/template.env" ]; then printf '"%s",' "$id"; fi
          done)

          build=false
          if [ -n "$ids" ]; then build=true; fi

          publish=false
          if [ "$build" = true ] && [ "$event" != pull_request ] && [ "$ref" = refs/heads/main ]; then
            publish=true
          fi

          {
            echo "ids=[${ids%,}]"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  # The bootstrap builds the image and runs the suite, the same two commands a
  # developer runs, and what it built is then what gets pushed -- so a published
  # image is the one the tests passed against rather than a second build of the
  # same Dockerfile.
  image-amd64:
    needs: [scope, lint, contract, remote]
    # Everything cheap runs first. Three minutes of script tests and linters
    # against seventy builds is not a trade worth thinking about, and the if
    # below is deliberately not wrapped in !cancelled(): that would override
    # the success requirement needs already carries.
    if: ${{ needs.scope.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Six times the slowest template. Without one a hung leg holds a runner
    # for GitHub's six-hour default, and the weekly matrix is seventy of them.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Every build resolves its FROM from Docker Hub, which rate-limits per
      # account rather than per runner. Fifty-one at once answered 429. See the
      # arm64 job for what two caps of eight add up to.
      max-parallel: 8
      matrix:
        template: ${{ fromJSON(needs.scope.outputs.ids) }}
    env:
      # An attestation is a second entry in the index, which imagetools would
      # then carry into the merged manifest as a bogus platform.
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1

      # Read by the if on the Docker Hub login below. The two secrets are
      # optional -- they lift an anonymous pull limit that GitHub runners share
      # an IP address against -- so a fork PR, which gets none, still builds.
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      # Without an identity bootstrap.sh takes its commitless fallback, exits 0,
      # and the commit path silently stops being covered.
      - name: git identity
        run: |
          git config --global user.name 'bootstrap ci'
          git config --global user.email 'ci@example.invalid'

      - if: env.dockerhub_username != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      # --no-pull because the point of this job is the Dockerfile. Pulling the
      # published image would test the previous commit's toolchain against this
      # commit's templates, and a broken Dockerfile would go green.
      - run: ./bootstrap.sh ${{ matrix.template }} ../scaffold --no-pull

      # bootstrap.sh finishes on make test. The generated workflow runs make
      # lint as well and this one never has, which is how a lint target that
      # passed by saying nothing -- gprbuild reusing objects it had not checked
      # -- survived as long as it did.
      - name: lint the scaffold
        working-directory: ../scaffold
        run: make lint

      # bootstrap.sh finishes on make test, so this is the check containers.md
      # asks for and the contract job cannot make: it runs before any build, so
      # a lock file or a build artefact written into the bind mount is invisible
      # to it and lands here instead.
      - name: the suite left the tree clean
        run: |
          dirt=$(git -C ../scaffold status --porcelain)
          if [ -n "$dirt" ]; then
            echo "make test wrote into the working tree:" >&2
            echo "$dirt" >&2
            exit 1
          fi

      # A formatter on a freshly scaffolded project should have nothing to do,
      # so this doubles as a check that the template files ship formatted. It
      # is also the first time fmt runs in CI at all: lint and test were run,
      # and a formatter that mangled the file it formatted was a developer's
      # problem to find.
      - name: fmt changes nothing
        working-directory: ../scaffold
        run: |
          make fmt
          dirt=$(git status --porcelain)
          if [ -n "$dirt" ]; then
            echo "make fmt reformatted files that shipped unformatted:" >&2
            echo "$dirt" >&2
            exit 1
          fi

      # Not shell. It opens an interactive shell, which on a runner with no
      # terminal holds the leg until the timeout rather than failing.
      - name: the remaining targets run
        working-directory: ../scaffold
        run: |
          make build
          make help

      # The contract job greps one scaffold, for javascript, because building
      # thirty-seven images to read thirty-seven files would be absurd there.
      # Here the image is already built and the scaffold already on disk.
      - name: every placeholder was substituted
        run: |
          if grep -rn '{{[A-Z_]\{2,\}}}' ../scaffold --exclude-dir=.git; then
            echo "the lines above still carry template tokens" >&2
            exit 1
          fi

      # The procedure the timing table in containers.md came from: wipe the
      # cache volume, time a cold run, time a warm one. The mandatory rule is
      # that no run repeats work an earlier one did, and until now nothing
      # measured it.
      #
      # Asserted only above four seconds. Below that the figure is almost all
      # container startup -- a floor of about 0.9s -- and the two runs differ
      # by noise in either direction. Nine templates clear the threshold and
      # the slimmest real margin among them is java at 10.0s against 5.8s, so
      # a plain comparison is lenient and still catches a template that caches
      # nothing at all.
      - name: a second test run reuses the first
        working-directory: ../scaffold
        run: |
          docker compose down -v
          start=$(date +%s%3N)
          make test
          mid=$(date +%s%3N)
          make test
          end=$(date +%s%3N)
          cold=$((mid - start))
          warm=$((end - mid))
          echo "cold ${cold}ms, warm ${warm}ms"
          if [ "$cold" -ge 4000 ] && [ "$warm" -ge "$cold" ]; then
            echo "the second run repeated the first: nothing is cached" >&2
            exit 1
          fi

      - name: ghcr login
        if: ${{ needs.scope.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The name is read out of the scaffold rather than rebuilt from the
      # template id, for the reason bootstrap.sh reads it back too: the tag
      # pushed here cannot then drift from the one compose will pull.
      #
      # Two tags, because manifest cannot see a matrix sibling's result and a
      # :main-amd64 left by an earlier run looks exactly like one this run
      # wrote. A tag naming this commit cannot be mistaken for an older one, so
      # it is what manifest merges from.
      - name: push what the tests passed
        if: ${{ needs.scope.outputs.publish == 'true' }}
        run: |
          image=$(sed -n 's/^ *image: *//p' ../scaffold/compose.yaml)
          docker tag "$image" "${image}-amd64"
          docker tag "$image" "${image%:*}:${GITHUB_SHA}-amd64"

          # ghcr creates the package on a template's first ever push, and the
          # two architectures race to do it. The loser is denied after every
          # layer has already uploaded, which is what left one template with
          # an arm64-only :main. Retrying costs nothing when nothing is wrong.
          pushed=no
          for attempt in 1 2 3; do
            if docker push "${image}-amd64" && docker push "${image%:*}:${GITHUB_SHA}-amd64"; then
              pushed=yes
              break
            fi
            echo "push failed; ghcr may still be creating the package" >&2
            sleep $((attempt * 10))
          done

          [ "$pushed" = yes ]
  # The same steps on arm hardware, beside the amd64 matrix rather than behind
  # it, and gated on the same four jobs. A published arm64 image has now been run
  # on arm64, which it never was while publishing was its own workflow.
  #
  # max-parallel is per job, so two matrices at 8 peak at 16 concurrent builds
  # where the old sequence held 8. The pull count per run is unchanged, and the
  # limit that answered 429 is counted per account over six hours rather than
  # per instant -- the concurrency group that stopped runs stacking is what fixed
  # that. If one shows up anyway, the dial is 4 in both jobs.
  image-arm64:
    needs: [scope, lint, contract, remote]
    if: ${{ needs.scope.outputs.build == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        template: ${{ fromJSON(needs.scope.outputs.ids) }}
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1

      # Read by the if on the Docker Hub login below. The two secrets are
      # optional -- they lift an anonymous pull limit that GitHub runners share
      # an IP address against -- so a fork PR, which gets none, still builds.
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: git identity
        run: |
          git config --global user.name 'bootstrap ci'
          git config --global user.email 'ci@example.invalid'

      - if: env.dockerhub_username != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - run: ./bootstrap.sh ${{ matrix.template }} ../scaffold --no-pull

      # bootstrap.sh finishes on make test. The generated workflow runs make
      # lint as well and this one never has, which is how a lint target that
      # passed by saying nothing -- gprbuild reusing objects it had not checked
      # -- survived as long as it did.
      - name: lint the scaffold
        working-directory: ../scaffold
        run: make lint

      # bootstrap.sh finishes on make test, so this is the check containers.md
      # asks for and the contract job cannot make: it runs before any build, so
      # a lock file or a build artefact written into the bind mount is invisible
      # to it and lands here instead.
      - name: the suite left the tree clean
        run: |
          dirt=$(git -C ../scaffold status --porcelain)
          if [ -n "$dirt" ]; then
            echo "make test wrote into the working tree:" >&2
            echo "$dirt" >&2
            exit 1
          fi

      # A formatter on a freshly scaffolded project should have nothing to do,
      # so this doubles as a check that the template files ship formatted. It
      # is also the first time fmt runs in CI at all: lint and test were run,
      # and a formatter that mangled the file it formatted was a developer's
      # problem to find.
      - name: fmt changes nothing
        working-directory: ../scaffold
        run: |
          make fmt
          dirt=$(git status --porcelain)
          if [ -n "$dirt" ]; then
            echo "make fmt reformatted files that shipped unformatted:" >&2
            echo "$dirt" >&2
            exit 1
          fi

      # Not shell. It opens an interactive shell, which on a runner with no
      # terminal holds the leg until the timeout rather than failing.
      - name: the remaining targets run
        working-directory: ../scaffold
        run: |
          make build
          make help

      # The contract job greps one scaffold, for javascript, because building
      # thirty-seven images to read thirty-seven files would be absurd there.
      # Here the image is already built and the scaffold already on disk.
      - name: every placeholder was substituted
        run: |
          if grep -rn '{{[A-Z_]\{2,\}}}' ../scaffold --exclude-dir=.git; then
            echo "the lines above still carry template tokens" >&2
            exit 1
          fi

      # The procedure the timing table in containers.md came from: wipe the
      # cache volume, time a cold run, time a warm one. The mandatory rule is
      # that no run repeats work an earlier one did, and until now nothing
      # measured it.
      #
      # Asserted only above four seconds. Below that the figure is almost all
      # container startup -- a floor of about 0.9s -- and the two runs differ
      # by noise in either direction. Nine templates clear the threshold and
      # the slimmest real margin among them is java at 10.0s against 5.8s, so
      # a plain comparison is lenient and still catches a template that caches
      # nothing at all.
      - name: a second test run reuses the first
        working-directory: ../scaffold
        run: |
          docker compose down -v
          start=$(date +%s%3N)
          make test
          mid=$(date +%s%3N)
          make test
          end=$(date +%s%3N)
          cold=$((mid - start))
          warm=$((end - mid))
          echo "cold ${cold}ms, warm ${warm}ms"
          if [ "$cold" -ge 4000 ] && [ "$warm" -ge "$cold" ]; then
            echo "the second run repeated the first: nothing is cached" >&2
            exit 1
          fi

      - name: ghcr login
        if: ${{ needs.scope.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push what the tests passed
        if: ${{ needs.scope.outputs.publish == 'true' }}
        run: |
          image=$(sed -n 's/^ *image: *//p' ../scaffold/compose.yaml)
          docker tag "$image" "${image}-arm64"
          docker tag "$image" "${image%:*}:${GITHUB_SHA}-arm64"

          # ghcr creates the package on a template's first ever push, and the
          # two architectures race to do it. The loser is denied after every
          # layer has already uploaded, which is what left one template with
          # an arm64-only :main. Retrying costs nothing when nothing is wrong.
          pushed=no
          for attempt in 1 2 3; do
            if docker push "${image}-arm64" && docker push "${image%:*}:${GITHUB_SHA}-arm64"; then
              pushed=yes
              break
            fi
            echo "push failed; ghcr may still be creating the package" >&2
            sleep $((attempt * 10))
          done

          [ "$pushed" = yes ]

  # The per-architecture tags above are the inputs; this is the tag compose
  # pulls, and it has to be an index covering both or an arm64 host gets an
  # amd64 image.
  manifest:
    needs: [scope, image-amd64, image-arm64]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success'
      && needs.scope.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.scope.outputs.ids) }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only what this run pushed. A :main-<arch> written minutes ago and one
      # left by an earlier run are indistinguishable, and for a template whose
      # legs both failed the second kind used to be re-merged and published
      # green with nothing having tested it. A tag naming this commit cannot be
      # that: no earlier run wrote this sha.
      - name: merge the architectures this run published
        run: |
          image=ghcr.io/${{ github.repository }}/${{ matrix.template }}
          set --
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "$image:$GITHUB_SHA-$arch" >/dev/null 2>&1; then
              set -- "$@" "$image:$GITHUB_SHA-$arch"
            fi
          done

          # Nothing to do rather than an error: a tag is missing only when that
          # architecture's leg failed, and that is already red.
          if [ "$#" -ne 2 ]; then
            echo "not republishing $image: $# of 2 architectures published" >&2
            exit 0
          fi

          docker buildx imagetools create --tag "$image:main" "$@"
          docker buildx imagetools inspect "$image:main"

  # Every publish leaves the previous index and its two children behind: the
  # durable tags move on, the digests stay, and nothing removed them until this
  # job. Pruning them is safe here for a reason worth stating, because every
  # other source says the opposite: an index's platform manifests are normally
  # untagged, so deleting untagged digests breaks a live multi-architecture tag.
  # In this registry they are not untagged -- :main-amd64 and :main-arm64 exist
  # because that is how the architectures are published -- and attestations are
  # off, so nothing else is untagged either.
  #
  # The rule is therefore "no durable tag" rather than "no tag": a digest also
  # carries the sha tag manifest merged it from, which outlives :main-<arch> by
  # one run. A version whose only tags are run tokens has been superseded just
  # as surely as one with none.
  #
  # The packages sit under the *user* namespace, where the REST endpoints normally
  # want a PAT. Not here: these inherit access from the repository, so
  # GITHUB_TOKEN lists them at users/<owner>/... and deletes them at user/... --
  # established by a read-only probe, then by 426 deletions that all went through.
  cleanup:
    needs: [scope, manifest]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success'
      && needs.scope.outputs.publish == 'true'
      && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    # Slack, not a limit: the cap inside the prune is what keeps it finite.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The hour's grace is not about the tagging argument above. It is for a
      # run this one overlapped, whose index is minutes old.
      #
      # A dry run of the first form of this filter kept 105 tagged versions --
      # exactly three per template, which was every tag that existed -- so the
      # keep set is the live set and nothing reachable is in the delete set.
      - name: delete superseded versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
        run: |
          limit=25
          cutoff=$(date -u -d '1 hour ago' +%s)
          gone=0
          kept=0

          for dir in templates/*/; do
            id=${dir#templates/}
            id=${id%/}
            package="bootstrap%2F$id"

            if ! gh api --paginate \
              "users/$owner/packages/container/$package/versions" \
              --jq '.[] | select([.metadata.container.tags[]
                                  | select(test("^[0-9a-f]{40}-(amd64|arm64)$") | not)]
                                 | length == 0)
                        | "\(.id) \(.created_at) \(.name)"' \
              > newest-first.txt; then
              # A template that has never published has no package to list.
              echo "no package yet for $id"
              continue
            fi

            # Oldest first. The API answers newest first, and a capped run
            # pruning from that end would leave the ancient digests forever.
            sort -k2 newest-first.txt > untagged.txt

            here=0
            while read -r vid created digest; do
              [ -n "$vid" ] || continue
              if [ "$(date -u -d "$created" +%s)" -gt "$cutoff" ]; then
                kept=$((kept + 1))
                continue
              fi

              # A cap, not a longer timeout. The first run of this found a
              # backlog of a thousand from a day of rebuilds and ran out of
              # minutes; steady state is three per template, so the cap only
              # bites while a backlog drains.
              if [ "$here" -ge "$limit" ]; then
                echo "$id: stopping at $limit, more remain"
                break
              fi

              # user/packages/... is the spelling a repository-scoped token may use
              # for a user-namespace package: the first real run went through it
              # 426 times and never needed the users/<owner>/... fallback that
              # used to sit behind it.
              if ! gh api -X DELETE "user/packages/container/$package/versions/$vid"; then
                echo "could not delete $id ${digest#sha256:}" >&2
                exit 1
              fi

              gone=$((gone + 1))
              here=$((here + 1))
            done < untagged.txt
          done

          echo "deleted $gone superseded versions, kept $kept under an hour old"

  # Asserting which failure happened, not merely that one did -- on all three
  # host platforms, because every assertion here is --dry-run or --no-build and
  # so needs no docker. macOS and Windows runners cannot run a Linux container,
  # so they cover the script and never a toolchain.
  #
  # The Windows leg drives bootstrap.ps1, which is the entry point Windows users
  # are told to run. bootstrap.sh is still exercised there, by the parity step
  # at the end: comparing the two means running both.
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # macOS is the only runner with the bash the header names as the floor,
      # which makes it the only one that tests the claim rather than repeating
      # it. /bin/bash explicitly: the shebang takes whatever PATH offers.
      - name: the bash floor
        if: ${{ runner.os == 'macOS' }}
        run: |
          /bin/bash --version | head -1
          /bin/bash ./bootstrap.sh javascript ../floor --dry-run

      - name: git identity
        run: |
          git config --global user.name 'bootstrap ci'
          git config --global user.email 'ci@example.invalid'

      - name: psscriptanalyzer
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          }
          $found = Invoke-ScriptAnalyzer -Path .\bootstrap.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          if ($found.Count -gt 0) {
            $found | Format-Table RuleName, Line, Message -AutoSize | Out-String -Width 200
            exit 1
          }

      - name: exit codes
        if: ${{ runner.os != 'Windows' }}
        run: |
          expect() {
            local want=$1
            shift
            set +e
            "$@" >/dev/null 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "expected $want from '$*', got $got" >&2
              exit 1
            fi
          }
          expect 1 ./bootstrap.sh
          expect 1 ./bootstrap.sh --nosuchflag javascript ../out
          expect 2 ./bootstrap.sh nosuchlang ../out
          expect 3 ./bootstrap.sh javascript .
          expect 0 ./bootstrap.sh javascript ../out --dry-run

      - name: exit codes
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          # Four of these five provoke a usage error on purpose, and Actions
          # runs this shell with ErrorActionPreference = Stop, under which
          # anything a child writes to stderr becomes a NativeCommandError and
          # fails the step -- whatever the child exit code was, which is the
          # thing being asserted.
          $ErrorActionPreference = 'Continue'

          function Expect {
            param([int]$Want, [string[]]$Arguments)
            & powershell -ExecutionPolicy Bypass -File .\bootstrap.ps1 @Arguments *> $null
            if ($LASTEXITCODE -ne $Want) {
              Write-Output "expected $Want from bootstrap.ps1 $Arguments, got $LASTEXITCODE"
              exit 1
            }
          }
          Expect 1 @()
          Expect 1 @('--nosuchflag', 'javascript', '..\out')
          Expect 2 @('nosuchlang', '..\out')
          Expect 3 @('javascript', '.')
          Expect 0 @('javascript', '..\out', '--dry-run')

      - name: dry-run writes nothing
        if: ${{ runner.os != 'Windows' }}
        run: |
          ./bootstrap.sh javascript ../out --dry-run
          test ! -e ../out

      - name: dry-run writes nothing
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          & powershell -ExecutionPolicy Bypass -File .\bootstrap.ps1 javascript ..\out --dry-run
          if (Test-Path ..\out) {
            Write-Output 'dry-run created the target'
            exit 1
          }

      - name: no token survives substitution
        if: ${{ runner.os != 'Windows' }}
        run: |
          ./bootstrap.sh javascript ../out --no-build
          ! grep -rn '{{[A-Z_]\{2,\}}}' ../out

      # The pattern names the closed token set on purpose: a bare brace pair
      # also matches the secrets expression in every generated CI workflow, so
      # it could never find nothing.
      - name: no token survives substitution
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          & powershell -ExecutionPolicy Bypass -File .\bootstrap.ps1 javascript ..\out --no-build
          $left = Get-ChildItem ..\out -Recurse -File | Select-String -Pattern '\{\{[A-Z_]{2,}\}\}'
          if ($left) {
            $left
            exit 1
          }

      # .env carries the host uid and gid, so it is generated and gitignored --
      # a commit containing it would be a real bug nothing else here would see.
      - name: the scaffold is committed
        if: ${{ runner.os != 'Windows' }}
        run: |
          ./bootstrap.sh javascript ../committed --no-build | tee ../scaffold.log
          grep -q 'initialised, 1 commit' ../scaffold.log
          git -C ../committed rev-parse --abbrev-ref HEAD | grep -qx main
          test "$(git -C ../committed rev-list --count HEAD)" -eq 1
          test "$(git -C ../committed log -1 --pretty=%s)" = 'chore: bootstrap javascript project'
          test -z "$(git -C ../committed status --porcelain)"
          test -f ../committed/.env
          test -z "$(git -C ../committed ls-files .env)"

      # No .env assertion here: Windows gets none on purpose, because the uid
      # either script could report is a Windows RID that means nothing to a
      # Linux container, so compose falls back to its own 1000:1000.
      - name: the scaffold is committed
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          function Fail($why) { Write-Output $why; exit 1 }
          $log = & powershell -ExecutionPolicy Bypass -File .\bootstrap.ps1 javascript ..\committed --no-build
          $log
          if (-not ($log -match 'initialised, 1 commit')) { Fail 'no commit step line' }
          if ((& git -C ..\committed rev-parse --abbrev-ref HEAD) -ne 'main') { Fail 'wrong branch' }
          if ((& git -C ..\committed rev-list --count HEAD) -ne '1') { Fail 'wrong commit count' }
          if ((& git -C ..\committed log -1 --pretty=%s) -ne 'chore: bootstrap javascript project') { Fail 'wrong subject' }
          if (& git -C ..\committed status --porcelain) { Fail 'tree is dirty' }

      # Each side lists the templates in its own shell, because bash invoked
      # from PowerShell is whatever is first on PATH -- the WSL one, on a
      # machine that has it, which is not the shell bootstrap.sh runs under.
      - name: list every template as powershell sees it
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ..\parity | Out-Null
          foreach ($id in (Get-ChildItem templates -Directory).Name) {
            $lines = & powershell -ExecutionPolicy Bypass -File .\bootstrap.ps1 --dry-run $id ..\scaffold
            $files = @($lines | Select-Object -Skip 1 | Select-Object -SkipLast 1 |
              ForEach-Object { $_.TrimEnd() })
            [IO.File]::WriteAllLines((Resolve-Path ..\parity).Path + "\$id.txt", $files)
          }

      # The file lists only. The step line either side of them names the target,
      # whose separator differs by shell, and that difference is meant to exist.
      - name: the two entry points agree on every template
        if: ${{ runner.os == 'Windows' }}
        run: |
          drift=0
          checked=0
          for dir in templates/*/; do
            id=${dir#templates/}
            id=${id%/}
            ./bootstrap.sh --dry-run "$id" ../scaffold | sed '1d;$d' > "../parity/$id.sh.txt"
            if ! diff -u "../parity/$id.sh.txt" <(tr -d '\r' < "../parity/$id.txt"); then
              echo "the two entry points disagree on $id" >&2
              drift=$((drift + 1))
            fi
            checked=$((checked + 1))
          done
          echo "checked $checked templates"
          [ "$drift" -eq 0 ]

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck bootstrap.sh

      - name: hadolint every template dockerfile
        run: |
          for f in templates/*/files/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done

      # Explicit paths: actionlint only discovers .github/workflows at the repo
      # root, so a bare invocation silently skips every template's workflow.
      - name: actionlint every workflow
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -color .github/workflows/*.yml templates/*/files/.github/workflows/ci.yml

  # bootstrap.ps1 had no job at all: six hundred lines of the product that
  # nothing ran, beside a twin that every push exercised. The parity step is
  # the one that matters, because the two are kept in step by hand.
  # The matrix above only exercises clone mode. Remote mode has its own failure
  # surface -- the ref, the download, the extract, the cleanup -- and no file on
  # disk, so nothing else here touches it. Both URLs are pinned to this commit
  # so the script under test fetches the templates that shipped with it, which
  # is the bug a floating ref would hide.
  #
  # On all three platforms because this is where the portability lives: mktemp
  # with no template, and tar --strip-components against bsdtar on macOS and
  # Git Bash's tar on Windows.
  remote:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      sha: ${{ github.sha }}
    steps:
      - name: scaffold through the documented one-liner
        if: ${{ runner.os != 'Windows' }}
        run: |
          BOOTSTRAP_REF=$sha /bin/bash -c \
            "$(curl -fsSL "https://raw.githubusercontent.com/acodeninja/bootstrap/$sha/bootstrap.sh")" \
            -- javascript ../out --no-git --no-build
          test -f ../out/package.json

      # The form docs/install.md documents for Windows: iex cannot pass
      # arguments to the code it runs, so the text is compiled into a script
      # block and invoked instead.
      - name: scaffold through the documented one-liner
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $url = "https://raw.githubusercontent.com/acodeninja/bootstrap/$env:sha/bootstrap.ps1"
          $env:BOOTSTRAP_REF = $env:sha
          & ([scriptblock]::Create((irm $url))) javascript ..\out --no-git --no-build
          if (-not (Test-Path ..\out\package.json)) {
            Write-Output 'the one-liner scaffolded nothing'
            exit 1
          }

      - name: a bad ref exits 6 and leaves no temporary directory
        if: ${{ runner.os != 'Windows' }}
        run: |
          # Where mktemp -d actually writes, which is not /tmp on macOS.
          tmp=${TMPDIR:-/tmp}
          before=$(find "$tmp" -maxdepth 1 -name 'tmp.*' -type d | wc -l)
          set +e
          BOOTSTRAP_REF=refs/heads/no-such-branch /bin/bash -c \
            "$(curl -fsSL "https://raw.githubusercontent.com/acodeninja/bootstrap/$sha/bootstrap.sh")" \
            -- javascript ../bad --no-git --no-build >/dev/null 2>&1
          got=$?
          set -e
          if [ "$got" -ne 6 ]; then echo "expected 6 from a bad ref, got $got" >&2; exit 1; fi
          test ! -e ../bad
          after=$(find "$tmp" -maxdepth 1 -name 'tmp.*' -type d | wc -l)
          if [ "$before" -ne "$after" ]; then echo "a temporary directory survived" >&2; exit 1; fi


      # The exit code has to come from a child process. A script block built
      # from a string runs in the caller's own process, where exit would end
      # the step rather than the script -- which is why docs/install.md gives
      # this longer form for anything that needs to act on a failure.
      - name: a bad ref exits 6 and leaves no temporary directory
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          # The child writes its error to stderr, and this shell's default
          # ErrorActionPreference of Stop would make that terminating before
          # the exit code could be read.
          $ErrorActionPreference = 'Continue'

          $url = "https://raw.githubusercontent.com/acodeninja/bootstrap/$env:sha/bootstrap.ps1"
          $temp = [IO.Path]::GetTempPath()
          $count = { @(Get-ChildItem $temp -Directory -Filter 'bootstrap-*' -ErrorAction SilentlyContinue).Count }
          $before = & $count

          # Through the environment, not inside the command string: powershell
          # -Command strips the quotes around an assignment, so the ref would be
          # run as a command, left unset, and the script would quietly fetch
          # main and succeed. A child inherits the variable instead.
          $env:BOOTSTRAP_REF = 'refs/heads/no-such-branch'
          $inner = '& ([scriptblock]::Create((irm ' + $url + '))) javascript ..\bad --no-git --no-build'
          & powershell -NoProfile -Command "$inner; exit `$LASTEXITCODE" *> $null

          if ($LASTEXITCODE -ne 6) {
            Write-Output "expected 6 from a bad ref, got $LASTEXITCODE"
            exit 1
          }
          if (Test-Path ..\bad) {
            Write-Output 'a bad ref wrote a target'
            exit 1
          }
          if ((& $count) -ne $before) {
            Write-Output 'a temporary directory survived'
            exit 1
          }

          # The child's 6 is still in LASTEXITCODE, and the shell Actions wraps
          # this in exits with whatever it holds.
          exit 0
