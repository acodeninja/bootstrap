name: {{PROJECT_SLUG}}

services:
  dev:
    build:
      context: .
      cache_from:
        - ghcr.io/acodeninja/bootstrap/flix:main
      cache_to:
        - type=inline
    image: ghcr.io/acodeninja/bootstrap/flix:main
    working_dir: /work
    init: true
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    volumes:
      - .:/work
      - cache:/cache
      - lib:/work/lib
      - build:/work/build

volumes:
  cache:
  lib:
  build:
