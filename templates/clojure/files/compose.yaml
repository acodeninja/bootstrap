name: {{PROJECT_SLUG}}

services:
  dev:
    build: .
    image: ghcr.io/acodeninja/bootstrap/clojure:main
    working_dir: /work
    init: true
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    volumes:
      - .:/work
      - cache:/cache
      - cpcache:/work/.cpcache

volumes:
  cache:
  cpcache:
